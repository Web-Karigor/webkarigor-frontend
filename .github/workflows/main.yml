name: Deploy Next.js to cPanel

on:
  push:
    branches:
      - juel/home-page

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Build
        run: npm run build

      - name: Copy files to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.PORT }}
          source: |
            .next
            public
            package.json
            package-lock.json
            next.config.mjs
            server.js
          target: /home/dhanshir/demo.webkarigor.com

      - name: Restart Node App
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            source /home/dhanshir/nodevenv/demo.webkarigor.com/22/bin/activate

            cd /home/dhanshir/demo.webkarigor.com

            npm install --omit=dev

            mkdir -p tmp

            touch tmp/restart.txt
